# Build the plugin on every push to main and attach the zip to a GitHub
# release tagged v<version> (version comes from build.gradle.kts).
# Install: Settings | Plugins | ⚙ | Install Plugin from Disk… → the zip.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # create the tag and release, upload the zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false

      - name: Build plugin
        run: ./gradlew --no-daemon buildPlugin

      - name: Read version
        id: meta
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' build.gradle.kts)
          test -n "$version"
          zip=$(ls build/distributions/nitpick-*.zip)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          ZIP: ${{ steps.meta.outputs.zip }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Point the version tag at this commit. Pushes without a version bump
          # refresh the same release instead of creating a new one.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$SHA" -F force=true >/dev/null
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --notes "Built from $SHA."
          else
            gh release create "$TAG" "$ZIP" --target "$SHA" --title "$TAG" \
              --notes "Built from $SHA. Install: Settings | Plugins | ⚙ | Install Plugin from Disk… → the zip."
          fi
